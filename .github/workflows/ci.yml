name: OptmaPay Sandbox Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54399:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install Dependencies
        run: npm ci

      - name: Apply Database Migrations (PostgreSQL Smoke Test)
        run: node scripts/apply-migrations-test.js
        env:
          DATABASE_TEST_URL: postgresql://postgres:postgres@127.0.0.1:54399/postgres

      - name: Run Test Suite (Vitest)
        run: npm run test:run
        env:
          DATABASE_TEST_URL: postgresql://postgres:postgres@127.0.0.1:54399/postgres
          OPTMAPAY_WEBHOOK_MASTER_KEY: ci-test-only-master-key-00000000000000000000000000000000
          OPTMAPAY_INTERNAL_DISPATCH_TOKEN: ci-test-only-internal-token-1234567890

      - name: Run ESLint
        run: npm run lint

      - name: Run Strict API Typecheck
        run: npm run typecheck:api

      - name: Run Deno Check on Edge Functions
        run: npm run check:edge

      - name: Run Production Bundle Build
        run: npm run build
