name: OptmaPay Sandbox Quality Gates

# Least privileges needed for Gitleaks to read pull-request commits.
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, agent/p0-supabase-explicit-grants-20261021 , agent/p03-free-postgrest-rls-ci-20261021, agent/p04-transaction-owner-rls-20261022]

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54399:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || (github.event.before != '0000000000000000000000000000000000000000' && format('{0}..{1}', github.event.before, github.event.after) || '--max-count=5') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install Dependencies
        run: npm ci

      - name: Run Repository Secret Scanner Gate
        run: npm run scan:secrets

      # Offline read-only provenance attestation. No Supabase keys or hosted DB access.
      - name: Verify migration provenance and known version collision (P0.5)
        run: |
          node scripts/check-migration-provenance.js --self-test
          node scripts/check-migration-provenance.js

      - name: Apply Database Migrations (PostgreSQL Smoke Test)
        run: node scripts/apply-migrations-test.js
        env:
          DATABASE_TEST_URL: postgresql://postgres:postgres@127.0.0.1:54399/postgres

      # Real PostgREST speaks HTTP+JWT to the same reconstructed PostgreSQL 17 DB.
      # No Supabase cloud branch, remote database, real key, or production data.
      - name: Seed synthetic Data API tenant fixtures
        run: node scripts/test-data-api-rls.js --setup
        env:
          DATABASE_TEST_URL: postgresql://postgres:postgres@127.0.0.1:54399/postgres
          CI_POSTGREST_DB_PASSWORD: ci-local-no-production-credential
          CI_POSTGREST_JWT_SECRET: ci-test-only-hs256-jwt-secret-not-prod-20261021-12345

      - name: Start disposable PostgREST HTTP API
        run: |
          docker run -d --rm --name optmapay-postgrest-ci --network host \
            -e PGRST_DB_URI=postgres://authenticator:ci-local-no-production-credential@127.0.0.1:54399/postgres \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET=ci-test-only-hs256-jwt-secret-not-prod-20261021-12345 \
            -e PGRST_SERVER_PORT=3003 \
            postgrest/postgrest:v14.18
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3003/ >/dev/null; then break; fi
            if [ "$attempt" -eq 40 ]; then
              docker logs optmapay-postgrest-ci
              exit 1
            fi
            sleep 1
          done

      - name: Verify authenticated and negative RLS over Data API
        run: node scripts/test-data-api-rls.js --verify
        env:
          DATABASE_TEST_URL: postgresql://postgres:postgres@127.0.0.1:54399/postgres
          CI_POSTGREST_DB_PASSWORD: ci-local-no-production-credential
          CI_POSTGREST_JWT_SECRET: ci-test-only-hs256-jwt-secret-not-prod-20261021-12345

      - name: Stop disposable PostgREST
        if: always()
        run: docker rm -f optmapay-postgrest-ci || true

      - name: Run Test Suite (Vitest)
        # Shared integration PostgreSQL fixtures must not execute concurrently.
        run: npm run test:run -- --fileParallelism=false
        env:
          DATABASE_TEST_URL: postgresql://postgres:postgres@127.0.0.1:54399/postgres
          OPTMAPAY_WEBHOOK_MASTER_KEY: ci-test-only-master-key-00000000000000000000000000000000
          OPTMAPAY_INTERNAL_DISPATCH_TOKEN: ci-test-only-internal-token-1234567890

      - name: Run ESLint
        run: npm run lint

      - name: Run Strict API Typecheck
        run: npm run typecheck:api

      - name: Run Deno Check on Edge Functions
        run: npm run check:edge

      - name: Run Production Bundle Build
        run: npm run build
